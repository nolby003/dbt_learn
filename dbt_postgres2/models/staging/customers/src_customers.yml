version: 2

models:
  - name: dim_customers
    description: "This table contains customer information."
    columns:
      - name: customer_id
        description: "The unique identifier for a customer."
        tests:
          - not_null
          - unique
      - name: customer_sal
        description: "The customer's Salutation."
        tests:
          - not_null
      - name: customer_fname
        description: "The customer's first name."
        tests:
          - not_null
      - name: customer_lname
        description: "The customer's last name."
        tests:
          - not_null
      - name: customer_gender
        description: "The customer's gender."
        tests:
          - not_null
          - unique
      - name: customer_created
        description: "The timestamp when the customer was created."
        tests:
          - not_null
      - name: customer_modified
        description: "The timestamp when the customer was last modified."
        tests:
          - not_null          

sources:
  - name: public           # your source schema/database
    schema: public
    tables:
      - name: dim_customers # raw table