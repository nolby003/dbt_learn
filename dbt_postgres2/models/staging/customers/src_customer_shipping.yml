version: 2

models:
  - name: dim_customer_shipping
    description: "This table contains customer shipping information."
    columns:
      - name: address_id
        description: "The unique address identifier for a customer."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "The unique identifier for a customer."
        tests:
          - not_null
      - name: is_primary
        description: "Indicates if this is the primary shipping address for the customer."
        tests:
          - not_null      
      - name: address_unitnum
        description: "The street address unit number for customer shipping."
        tests:
          - not_null
      - name: address_streetnum
        description: "The street address number for customer shipping."
        tests:
          - not_null
      - name: address_streetname
        description: "The street name for customer shipping."
        tests:
          - not_null
      - name: address_streettype
        description: "The street type for customer shipping."
        tests:
          - not_null  
      - name: address_suburb
        description: "The suburb for customer shipping."
        tests:
          - not_null                    
      - name: address_city
        description: "The city for customer shipping."
        tests:
          - not_null
      - name: address_state
        description: "The state for customer shipping."
        tests:
          - not_null          
      - name: address_pcode
        description: "The postal code for customer shipping."
        tests:
          - not_null
      - name: address_country
        description: "The country for customer shipping."
        tests:
          - not_null
      - name: address_created
        description: "The timestamp when the address was created."
        tests:
          - not_null 
      - name: address_modified
        description: "The timestamp when the address was last modified."         
        tests:
          - not_null

sources:
  - name: public           # your source schema/database
    schema: public
    tables:
      - name: dim_customer_shipping # raw table